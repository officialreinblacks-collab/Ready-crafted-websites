<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--bg:#0b0e14;--bg2:#10141d;--glass:rgba(22,27,38,.72);--line:rgba(255,255,255,.07);--txt:#e9edf5;--mut:#7f8aa3;--acc:#7c8cff;--acc2:#a78bfa}
  html,body{margin:0;height:100%;background:radial-gradient(1200px 600px at 20% -10%,#161c2e 0%,var(--bg) 60%);color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
  #mw{position:relative;flex:3;min-height:0}
  #main{position:absolute;inset:0}
  #cv{position:absolute;left:0;top:0;z-index:2;pointer-events:none;touch-action:none}
  #rsi,#osc2{flex:1;min-height:0;border-top:1px solid var(--line);display:none}
  .sech{color:#9a9a9a;font-size:13px;letter-spacing:.04em;margin:20px 0 6px}
  .frow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #2c2c2c;font-size:15px}
  .frow b{font-weight:600;text-align:right}
  #legend{position:absolute;left:10px;top:6px;max-width:62vw;z-index:3;pointer-events:none;text-shadow:0 1px 8px rgba(11,14,20,.9)}
  #legend .t{font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--txt)}
  #legend .v{font-size:12px;margin-top:1px}
  #legend .s{font-size:9px;color:var(--mut);margin-left:8px;font-variant-numeric:tabular-nums}
  #inds{pointer-events:auto;margin-top:6px}
  .ir{display:flex;align-items:center;gap:4px;font-size:10px;line-height:1.25;color:#e8eaed;padding:2px 0;max-width:calc(100vw - 110px)}
  .ir .nm{margin-right:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .ir.off .nm{opacity:.4}
  .ir b{font-weight:400;color:#9aa3b5;padding:2px 5px;font-size:12px;flex:none}
  #col{margin-top:6px;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:11px}
  #tag{position:absolute;right:2px;width:74px;z-index:3;pointer-events:none;color:#06110d;font-size:12.5px;font-weight:700;text-align:center;padding:3px 0;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.35);line-height:1.25;display:none}
  #tag small{font-weight:500;font-variant-numeric:tabular-nums}
  #bar{display:flex;align-items:center;gap:0;margin:0;padding:0 4px env(safe-area-inset-bottom);border:0;border-top:1px solid var(--line);border-radius:0;background:var(--bg);box-shadow:none;overflow-x:auto;scrollbar-width:none}#bar::-webkit-scrollbar{display:none}
  #bar button{flex:none;background:none;border:0;color:var(--mut);font-size:14px;padding:5px 9px;border-radius:8px;white-space:nowrap;transition:background .15s,color .15s}#bar button:hover,#bar button:active{background:rgba(255,255,255,.07);color:var(--txt)}
  #bar button.txt{font-weight:700;color:var(--txt);background:rgba(124,140,255,.14)}
  #bar .sp{flex:1}
  #sheet{position:fixed;inset:0;background:rgba(5,7,12,.6);backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:9}
  #sheet.open{display:flex}
  #panel{background:linear-gradient(180deg,#171c29,#10141d);border-top:1px solid var(--line);box-shadow:0 -20px 50px rgba(0,0,0,.5);width:100%;max-height:82%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 18px 28px;box-sizing:border-box}
  #panel h3{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.01em}
  #panel h4{margin:16px 0 8px;font-size:13px;color:#9a9a9a;letter-spacing:.04em}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);border-radius:12px;min-width:64px;padding:12px 14px;font-size:16px}
  .chips button.wide{flex:1 1 100%;text-align:left}
  .chips button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(124,140,255,.35)}
  .tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid #333;margin:8px 0 12px}
  .tabs button{background:none;border:0;color:#9a9a9a;font-size:15px;padding:12px 14px;white-space:nowrap;border-radius:10px 10px 0 0}
  .tabs button.on{background:rgba(255,255,255,.07);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .tile{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;color:#eee;padding:16px 6px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
  .tile i{font-style:normal;font-size:28px;line-height:1}
  .tile.soon{opacity:.4}
  /* drawing toolbar: slim, docked at the top, draggable (TradingView style) + dropdown panels */
  #dbar{position:absolute;top:50px;left:50%;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:0;background:rgba(28,30,36,.97);border:1px solid var(--line);border-radius:10px;padding:2px 5px;box-shadow:0 4px 14px rgba(0,0,0,.55);max-width:97vw}
  #dbar #dname{display:none}
  #dbar button{position:relative;background:none;border:0;color:#e8eaed;min-width:36px;height:36px;padding:0 5px;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;border-radius:7px}
  #dbar button:active,#dbar button.open{background:rgba(255,255,255,.14)}
  #dbar button.on{color:#4d8dff}
  #dbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #dbar .dsw b{display:block;width:18px;height:3px;border-radius:2px;margin-top:1px;background:var(--c,#f5b942)}
  #dgrip{width:14px;height:26px;margin:0 3px 0 0;cursor:grab;touch-action:none;background-image:radial-gradient(#8a8f9a 1.3px,transparent 1.7px);background-size:6px 8px;background-position:2px 1px;opacity:.9}
  #dsep{width:1px;height:20px;background:var(--line);margin:0 3px}
  #dpop{position:absolute;z-index:7;display:none;background:#1e1f24;border:1px solid #2c2f38;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.65);color:#e8eaed;font-size:15px;min-width:200px;max-width:94vw;max-height:calc(100% - 110px);overflow-y:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
  #dpop.on{display:block}
  #dpop .dr{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;white-space:nowrap;cursor:pointer}
  #dpop .dr:active{background:rgba(255,255,255,.1)}
  #dpop .dr.on{background:#fff;color:#111}
  #dpop .dr.hd{color:#9aa0ac;font-size:13px;height:34px;cursor:default}
  #dpop .dr svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  #dpop .dr .sp{width:22px;flex:none}
  #dpop .dr .ar{margin-left:auto;opacity:.7}
  #dpop .dr .mini{margin-left:auto;display:flex;gap:2px}
  #dpop .dr .mini button{background:none;border:0;color:inherit;padding:6px;border-radius:6px;display:flex}
  #dpop .dsep{height:1px;background:#2c2f38;margin:4px 0}
  #dpop .pal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:7px 14px}
  #dpop .pal.gap{padding-top:14px}
  #dpop .sw{aspect-ratio:1;min-width:0;border-radius:4px;border:0;padding:0;cursor:pointer}
  #dpop .sw.on{outline:2px solid #fff;outline-offset:1px}
  #dpop .plus{aspect-ratio:1;border-radius:4px;border:1px dashed #666;background:none;color:#ccc;font-size:20px;line-height:1;padding:0}
  #dpop .op{padding:8px 14px 12px;color:#9aa0ac}
  #dpop .op .row{display:flex;align-items:center;gap:12px;margin-top:8px}
  #dpop .op input[type=range]{flex:1;accent-color:#2962ff}
  #dpop .op .pc{min-width:62px;text-align:center;border:1px solid #3a3d47;border-radius:8px;padding:8px 6px;color:#e8eaed}
  #dcust{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  #mw{touch-action:none}
  .stt{font-size:13px;color:#e8eaed;margin:0 0 4px 2px;text-shadow:0 0 4px #000}
  #modal{position:fixed;inset:0;background:rgba(5,7,12,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:12}
  #modal.open{display:flex}
  #dlg{background:linear-gradient(180deg,#171c29,#0f131b);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);border-radius:22px;width:min(94vw,560px);max-height:92vh;display:flex;flex-direction:column}
  .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0}
  .mh h3{margin:0;font-size:22px}
  .mh button{background:none;border:0;color:#e8eaed;font-size:22px}
  #mtabs{display:flex;gap:4px;padding:8px 12px 0;overflow-x:auto;border-bottom:1px solid #333}
  #mtabs button{background:none;border:0;border-bottom:3px solid transparent;color:#9a9a9a;font-size:16px;font-weight:600;padding:10px 10px;white-space:nowrap}
  #mtabs button.on{color:#fff;border-color:var(--acc)}
  #mbody{flex:1;overflow:auto;padding:6px 18px;min-height:120px}
  .fr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;font-size:16px}
  .fr input[type=checkbox]{width:24px;height:24px;accent-color:#fff}
  .fr input[type=number],.fr select{background:#151a24;color:#eee;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:16px;width:96px}
  .fr input[type=text]{background:#151a24;color:#eee;border:1px solid #333;border-radius:8px;padding:8px;font-size:16px;width:60%}
  .cc{border:1px solid #333;border-radius:12px;padding:10px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .cc select,.cc input{background:#151a24;color:#eee;border:1px solid #333;border-radius:8px;padding:8px;font-size:15px}
  .cc input{width:84px}
  .cc small{color:#9a9a9a;font-size:13px}
  .cc button,.addc{background:rgba(255,255,255,.07);color:#eee;border:0;border-radius:10px;padding:9px 14px;font-size:15px}
  .sw{display:flex;gap:6px}
  .sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
  .sw button.on{border-color:#fff}
  .mf{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
  .mf button{transition:filter .15s;background:none;border:1px solid var(--line);color:#eee;border-radius:10px;padding:10px 18px;font-size:16px}
  .mf #mok{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
  .mf .sp{flex:1}
  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;padding:10px 18px;border-radius:10px;font-weight:700;color:#fff;display:none}
  .up{color:var(--up)}.down{color:var(--dn)}

  #splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0b0e14;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:opacity .9s ease}
  #splash.out{opacity:0;pointer-events:none}
  #splash img{display:block;max-width:80vw;max-height:80vh;width:auto;height:auto;object-fit:contain;opacity:0;transition:opacity 1.8s ease-in-out}
  #splash.in img{opacity:1}
  @media (orientation:landscape){#splash img{max-height:78vh;max-width:60vw}}
  @media (orientation:portrait){#splash img{max-width:84vw;max-height:60vh}}
  @media (prefers-reduced-motion:reduce){#splash img{transition-duration:.01s}}
  #msearch{width:100%;box-sizing:border-box;margin:8px 0 2px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font:inherit;font-size:16px;outline:none}
  #msearch:focus{border-color:var(--acc)}
  #legend .lg{height:14px;width:auto;margin-left:6px;vertical-align:-3px;border-radius:5px;opacity:.95}
  .wl-r{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .wl-n{flex:1;display:flex;flex-direction:column;min-width:0}.wl-n b{font-size:16px}.wl-n small{color:var(--mut);font-size:12px}
  .wl-p{font-family:ui-monospace,monospace;font-size:15px;font-variant-numeric:tabular-nums}
  .wl-c{min-width:74px;text-align:center;padding:6px 8px;border-radius:10px;font-size:13px;font-weight:700;background:rgba(255,255,255,.06)}
  .wl-c.up{background:rgba(45,212,167,.15)}.wl-c.down{background:rgba(255,93,122,.15)}.wl-e{color:var(--mut);padding:14px 2px}
  .ob-tabs{display:flex;gap:6px;margin:4px 0 10px}.ob-tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);font:inherit;font-weight:600}.ob-tabs button.on{background:rgba(124,140,255,.16);color:var(--txt);border-color:var(--acc)}
  .ob-head{display:flex;font-size:12px;color:var(--mut);padding:2px 6px 6px}.ob-head span{flex:1}.ob-head span:nth-child(n+2){text-align:right}
  .ob-r{position:relative;display:flex;padding:5px 6px;font:13px ui-monospace,monospace;font-variant-numeric:tabular-nums}.ob-r i{position:absolute;right:0;top:1px;bottom:1px;opacity:.16;border-radius:3px}.ob-r i.b{background:var(--up)}.ob-r i.a{background:var(--dn)}
  .ob-r span{position:relative;flex:1}.ob-r span:nth-child(n+2){text-align:right}.ob-r span:nth-child(3){color:var(--mut)}.upc{color:var(--up)}.dn{color:var(--dn)}
  .ob-mid{display:flex;justify-content:space-between;align-items:baseline;padding:8px 6px;margin:4px 0;border-block:1px solid var(--line)}.ob-mid b{font:700 18px ui-monospace,monospace}.ob-mid small{color:var(--mut)}
  .ob-bar{height:6px;border-radius:6px;background:var(--dn);margin:12px 6px 4px;overflow:hidden}.ob-bar i{display:block;height:100%;background:var(--up)}.ob-bl{display:flex;justify-content:space-between;padding:0 6px;font-size:12px;font-weight:700}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.cgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
  .cin{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font:inherit;font-size:16px;outline:none}.cin:focus{border-color:var(--acc)}
  .cr{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line)}.cr span{color:var(--mut)}.cr b{font-family:ui-monospace,monospace}.cr b.big{font-size:20px}.cw{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(255,184,0,.12);color:#ffd27a;font-size:13px}
  #mtf{position:relative;flex:2;min-height:0;border-top:1px solid var(--line)}#mtfc{position:absolute;inset:0}
  #mtfbar{position:absolute;left:8px;top:6px;z-index:3;display:flex;gap:4px}#mtfbar button{border:1px solid var(--line);background:var(--glass);color:var(--mut);border-radius:9px;padding:4px 9px;font:600 12px system-ui}#mtfbar button.on{color:var(--txt);border-color:var(--acc)}
  .mood{text-align:center;padding:10px 0 16px}.mood small{display:block;color:var(--mut);letter-spacing:.1em;font-size:11px}.mood b{font-size:54px;line-height:1.1;display:block}.mood span{font-weight:700}
  .mbar{position:relative;height:8px;border-radius:8px;margin:14px 8px 0;background:linear-gradient(90deg,#ff5d7a,#ff9f43,#f5c542,#a3d977,#2dd4a7)}.mbar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:3px;background:var(--txt);transform:translateX(-50%)}
  textarea.cin{resize:none;font-size:12px;font-family:ui-monospace,monospace;margin-bottom:8px}

  /* ---- Markets list: TradingView-style rows ---- */
  #panel.mkp{background:#000}
  #panel.mkp h3{color:#fff}
  #panel.mkp #msearch{background:#1a1d24;border:1px solid #2a2e39;border-radius:12px;color:#fff}
  #panel.mkp #msearch:focus{border-color:#4aa8ff}
  .mk-row{display:flex;align-items:center;gap:14px;padding:12px 10px;border-bottom:1px solid #1e222d;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
  .mk-row:active{background:rgba(74,168,255,.12)}
  .mk-row.on{background:rgba(74,168,255,.22)}
  .mk-ic{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em}
  .mk-mid{flex:1;min-width:0}
  .mk-t{font-size:17px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mk-n{font-size:14px;color:#9aa3b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  /* ===== markets: category tabs + favourite button ===== */
  .mk-tabs{flex:none;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:10px 0 8px;margin:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
  .mk-tabs::-webkit-scrollbar{display:none}
  .mk-tab{flex:none;min-height:36px;padding:0 16px;border-radius:999px;border:1px solid #2a2e39;background:#1a1d24;color:#d1d4dc;font:inherit;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mk-tab.on{background:#fff;border-color:#fff;color:#0b0e14}
  .mk-fav{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid #2a2e39;background:transparent;color:#d1d4dc;font:inherit;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mk-fav.on{background:#4aa8ff;border-color:#4aa8ff;color:#fff;font-size:18px;font-weight:700}
  .mk-hint{flex:none;margin:8px 2px 0;font-size:13px;line-height:1.4;color:#9aa3b5}
  .mk-note{margin:4px 2px 8px;padding:10px 12px;border-radius:12px;border:1px solid #2a2e39;background:#1a1d24;font-size:13px;line-height:1.45;color:#9aa3b5}
  .mk-more{display:block;width:100%;box-sizing:border-box;margin:12px 0 4px;padding:14px 16px;border-radius:14px;border:1px dashed #2f6fb0;background:rgba(74,168,255,.08);color:#4aa8ff;font:inherit;font-size:15px;font-weight:600;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  html[data-theme=light] .mk-hint,html[data-theme=light] .mk-note{color:#566079}
  html[data-theme=light] .mk-note{background:#f1f3f9;border-color:#dfe3ee}
  html[data-theme=light] .mk-tab{background:#f1f3f9;border-color:#dfe3ee;color:#141a2b}
  html[data-theme=light] .mk-tab.on{background:#141a2b;border-color:#141a2b;color:#fff}
  html[data-theme=light] .mk-fav{border-color:#dfe3ee;color:#141a2b}
  html[data-theme=light] .mk-fav.on{color:#fff}
  html[data-theme=light] #panel.mkp{background:#fff}

  html[data-theme=light] .mk-row{border-bottom-color:#e6e9f2}
  html[data-theme=light] .mk-row.on{background:rgba(74,168,255,.2)}
  html[data-theme=light]{--bg:#f4f6fb;--bg2:#fff;--glass:rgba(255,255,255,.86);--line:rgba(20,30,60,.1);--txt:#141a2b;--mut:#667089;--acc:#4f5bd5;--acc2:#7a63e0}
  html[data-theme=light],html[data-theme=light] body{background:#f4f6fb}
  html[data-theme=light] #panel,html[data-theme=light] #dlg{background:#fff;box-shadow:0 -10px 40px rgba(20,30,60,.18)}
  html[data-theme=light] #legend{text-shadow:0 1px 6px rgba(244,246,251,.9)}
  html[data-theme=light] #tag{box-shadow:0 3px 10px rgba(20,30,60,.2)}
  html[data-theme=light] .cin,html[data-theme=light] #msearch{background:rgba(20,30,60,.04)}
  #tour{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,7,12,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}#tour.on{display:flex}
  /* ===== risk disclaimer gate ===== */
  #mkd-ov{position:fixed;inset:0;z-index:170;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,7,12,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #mkd-ov.on{display:flex}
  .mkd-card{width:min(460px,100%);max-height:92vh;max-height:92dvh;box-sizing:border-box;display:flex;flex-direction:column;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,#171c29,#10141d);box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
  .mkd-head{flex:none;padding:20px 22px 12px;font-size:20px;font-weight:800;color:var(--txt)}
  .mkd-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 22px 8px;font-size:14.5px;line-height:1.55;color:var(--mut)}
  .mkd-body p{margin:0 0 12px}.mkd-body .mkd-tag{color:var(--txt);font-weight:700;margin-bottom:4px}
  .mkd-foot{flex:none;padding:12px 22px 18px;border-top:1px solid var(--line)}
  .mkd-chk{display:flex;align-items:flex-start;gap:12px;margin:0 0 14px;font-size:14px;line-height:1.45;color:var(--txt);cursor:pointer}
  .mkd-chk input{flex:none;width:24px;height:24px;margin:0;accent-color:#4aa8ff}
  .mkd-btn{width:100%;min-height:48px;border:0;border-radius:14px;background:#4aa8ff;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .mkd-btn:disabled{opacity:.35;cursor:not-allowed}
  html[data-theme=light] .mkd-card{background:#fff;box-shadow:0 30px 70px rgba(20,30,60,.25)}html[data-theme=light] #mkd-ov{background:rgba(20,30,60,.55)}
  .tcard{width:min(420px,100%);box-sizing:border-box;text-align:center;padding:30px 22px 20px;border-radius:28px;border:1px solid var(--line);background:linear-gradient(180deg,#171c29,#10141d);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:tIn .35s ease}
  @keyframes tIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .tic{width:78px;height:78px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 12px 30px rgba(124,140,255,.35)}
  .tcard h2{margin:0 0 10px;font-size:22px;letter-spacing:-.01em;color:var(--txt)}.tcard p{margin:0 0 18px;font-size:15px;line-height:1.5;color:var(--mut)}
  .tk{display:flex;gap:8px;justify-content:center;margin-bottom:20px}.tk span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:11px;color:var(--mut)}.tk b{font-size:20px;color:var(--txt);font-weight:600}
  .tdots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}.tdots i{width:7px;height:7px;border-radius:7px;background:var(--line);transition:all .25s}.tdots i.on{width:22px;background:var(--acc)}
  .tbtn{display:flex;gap:10px}.tbtn button{flex:1;padding:14px;border-radius:14px;border:0;background:none;color:var(--mut);font:600 15px system-ui}.tbtn button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 22px rgba(124,140,255,.3)}
  html[data-theme=light] .tcard{background:#fff;box-shadow:0 30px 70px rgba(20,30,60,.25)}html[data-theme=light] #tour{background:rgba(20,30,60,.45)}

// [rbs] PREMIUM STRATEGY · "% Retest Buy & Sell"   (self-contained block: every name starts with rbs / RBS)
// Category: Premium Strategy.  Added by registering IND.rbs (same extras()/draw hook pattern as Super Buys and RSI Zone Reversal).
//
// SECTIONS  1 defaults · 2 input clean-up · 3 reference high/low · 4 candidate range + consolidation filter · 5 engine (state machine)
//           6 chart hook · 7 alerts · 8 drawing + debug panel · 9 settings panel A–M · 10 registration
//
// PERCENTAGE (exact):   h = anchor × Range% / 100            (basis "% of anchor price", default - the same maths as the chart's % measure)
//                       h = (HH − LL) × Range% / 100         (basis "% of lookback range")
//   anchor Low : B = LL, T = LL + h        anchor High : T = HH, B = HH − h        (HH/LL = highest high / lowest low of the lookback)
// BREAK   : close > T + buf  (up)   close < B − buf (down)      buf = Break buffer × ATR(14);  wick-based only when opted in
// RETEST  : up: low ≤ T + tol and close > T − tol       down: high ≥ B − tol and close < B + tol       tol = tolerance % × (T − B)
// BUY     : after an up-break and a retest bar r, a later bar within "confirmation candles" closes > T, bullish, and above high[r]
// SELL    : mirror at B.   INVERT (default ON): the break signals swap sides - break DOWN = BUY, break UP = SELL (same bars, opposite label).   INVALID: up-broken zone closes < T − invDist×(T−B); down-broken zone closes > B + invDist×(T−B)
// NON-REPAINTING: the forming candle is never used, a range is locked once confirmed, and bar i only ever sees bars ≤ i.
// =====================================================================================
/*RBS-ENGINE-BEGIN*/
// ---------- [rbs] SECTION 1 · constants & defaults ----------
const RBS_NAME='% Retest Buy & Sell';
const RBS_TFS={'15 minutes':900,'1 hour':3600,'4 hours':14400,'1 day':86400,'1 week':604800};
const RBS_SENS={ High:{inPct:65,minTouch:2,anchorTouch:1,erMax:.45,hAtr:1,contract:false}, Medium:{inPct:80,minTouch:3,anchorTouch:2,erMax:.30,hAtr:1.5,contract:false}, Low:{inPct:90,minTouch:4,anchorTouch:3,erMax:.20,hAtr:2,contract:true} };
const RBS_DEF={
  // A · range detection
  anchor:'Auto', rangeTf:'Current', confirmBars:2,
  // B · percentage
  pct:2, pctBasis:'Anchor price',
  // C · lookback
  lbUnit:'Candles', lbValue:200,
  // D · support & resistance
  tolPct:10,
  // E · consolidation filter
  consOn:true, consSens:'Medium',
  // F · buy / sell logic
  logic:'Break & Retest', confirm:'Break → Retest → Confirm', reclaimTrigger:'Close below, then close back', enableBuy:true, enableSell:true, invert:true, sigLimit:'1', cooldown:3,
  // G · breakout, retest & invalidation
  bufAtr:.1, wickBreak:false, confBars:3, strongConf:true, maxWait:150, reclaimBars:6, invDist:.5, maxAge:0, replaceOld:false,
  // H · auto extension

  // J · visuals

  boxCol:'#00bcd4', greyCol:'#9e9e9e', lvlCol:'#00bcd4', buyCol:'#2dd4a7', sellCol:'#ff5d7a', showBuy:true, showSell:true,
  // K · alerts
  alBuy:true, alSell:true, alBreak:false, alRetest:false, alRange:false, alSound:false,
  // L · performance

  // M · debug

// ---------- [rbs] SECTION 2 · input normalisation (every number is clamped here, never trusted) ----------
function rbsNorm(p){
  const o=Object.assign({},RBS_DEF,p||{}), n=(v,d,lo,hi)=>{ v=+v; if(!isFinite(v)) v=d; return Math.min(hi,Math.max(lo,v)); };

  o.extBars=Math.round(n(o.extBars,100,1,1e6)); o.manEndBars=Math.round(n(o.manEndBars,0,0,1e6)); o.manTop=+o.manTop||0; o.manBot=+o.manBot||0; o.manStartT=+o.manStartT||0;
  o.invert=o.invert!==false&&o.invert!=='false'&&o.invert!==0; o.sigLimit=o.sigLimit==='Unlimited'?0:Math.round(n(o.sigLimit,1,0,1000));

// lookback length in bars of the range timeframe:  L = round(value * unitSeconds / refSeconds), clamped to 5..5000
function rbsBars(P,refS){
  const u={Candles:refS,Hours:3600,Days:86400,Weeks:604800,Months:2592000}[P.lbUnit]||refS;
  return Math.max(5,Math.min(5000,Math.round(P.lbValue*u/refS)));
}
function rbsHtfSec(P,tfS,months){ const s=RBS_TFS[P.rangeTf]; return (!months&&s&&s>tfS)?s:0; }

// ---------- [rbs] SECTION 3 · reference high / low per bar (current timeframe or completed higher-timeframe buckets) ----------
function rbsWindows(c,nC,P,tfS,months){
  const hh=new Float64Array(nC).fill(NaN), ll=new Float64Array(nC).fill(NaN), st=new Int32Array(nC).fill(-1), htfS=rbsHtfSec(P,tfS,months);
  if(!htfS){
    const L=rbsBars(P,tfS), dh=[], dl=[]; let hh0=0, hl0=0;
    for(let i=0;i<nC;i++){
      while(dh.length>hh0&&c[dh[dh.length-1]].high<=c[i].high) dh.pop(); dh.push(i); while(dh[hh0]<=i-L) hh0++;
      while(dl.length>hl0&&c[dl[dl.length-1]].low>=c[i].low) dl.pop(); dl.push(i); while(dl[hl0]<=i-L) hl0++;
      if(i>=L-1){ hh[i]=c[dh[hh0]].high; ll[i]=c[dl[hl0]].low; st[i]=i-L+1; } }
    return {L,mode:'Current TF',hh,ll,st};
  }
  const bk=[]; for(let i=0;i<nC;i++){ const k=Math.floor(c[i].time/htfS), q=bk[bk.length-1];
    if(!q||q.key!==k) bk.push({key:k,hi:c[i].high,lo:c[i].low,s:i}); else { if(c[i].high>q.hi) q.hi=c[i].high; if(c[i].low<q.lo) q.lo=c[i].low; } }

    const m=cur+((c[i].time+tfS)>=(bk[cur].key+1)*htfS?1:0);          // number of COMPLETED higher-timeframe bars at bar i
    if(m>=L){ if(m!==lastM){ lastM=m; H=-Infinity; Lw=Infinity; for(let k=m-L;k<m;k++){ if(bk[k].hi>H) H=bk[k].hi; if(bk[k].lo<Lw) Lw=bk[k].lo; } S0=bk[m-L].s; }

// ---------- [rbs] SECTION 4 · candidate range + consolidation filter ----------
function rbsTouches(c,st,en,T,B,tol){ let tT=0,tB=0,lT=-99,lB=-99;
  for(let k=st;k<=en;k++){ if(c[k].high>=T-tol){ if(k-lT>=3) tT++; lT=k; } if(c[k].low<=B+tol){ if(k-lB>=3) tB++; lB=k; } }
  return [tT,tB]; }
function rbsInside(c,st,en,T,B){ let n=0; for(let k=st;k<=en;k++){ const x=c[k].close; if(x>=B&&x<=T) n++; } return n/(en-st+1); }

function rbsCand(c,i,W,P,S,X,full){
  const hh=W.hh[i], ll=W.ll[i], st=W.st[i], info={ok:false,hh,ll,st,why:[],i};
  if(!(st>=0)||!isFinite(hh)||!isFinite(ll)){ info.why.push('warming up (need '+W.L+' bars)'); return info; }
  if(!(hh>ll)){ info.why.push('flat range (high = low)'); return info; }
  const a=X.atr[i], aOk=isFinite(a), path=X.pl[i]-X.pl[st], er=path>0?Math.abs(c[i].close-c[st].close)/path:0; info.er=er; info.atr=aOk?a:NaN;

  else { const bL=boxFor('L'), bH=boxFor('H'), fL=rbsInside(c,st,i,bL.T,bL.B), fH=rbsInside(c,st,i,bH.T,bH.B);

  if(P.consOn&&aOk&&box.h<S.hAtr*a&&bad('box '+(box.h/a).toFixed(2)+'×ATR < '+S.hAtr+'×ATR')) return info;

// ---------- [rbs] SECTION 5 · the engine: ranges → breakout → retest → confirmation (closed candles only) ----------
function rbsEngine(c,p0,env){
  const P=rbsNorm(p0), n=c.length, nC=Math.max(0,n-1), tfS=env&&env.tfS>0?env.tfS:60, months=!!(env&&env.months);   // the forming candle (last) is never used
  const out={ranges:[],sigs:[],events:[],dev:null,dbg:null,nC,P,stat:''};
  if(nC<8){ out.dbg={state:'NO DATA',why:['need at least 8 closed candles']}; return out; }
  const atr=atrW(c,14), pl=new Float64Array(nC), ap=new Float64Array(nC+1), ac=new Int32Array(nC+1);
  for(let i=0;i<nC;i++){ pl[i]=i?pl[i-1]+Math.abs(c[i].close-c[i-1].close):0; const a=atr[i]; ap[i+1]=ap[i]+(isFinite(a)?a:0); ac[i+1]=ac[i]+(isFinite(a)?1:0); }

  let lastSig=-1e9;

    if((dir>0&&!P.enableBuy)||(dir<0&&!P.enableSell)||R.used||i-lastSig<P.cooldown) return false;
    R.sigCount++; if(P.sigLimit>0&&R.sigCount>=P.sigLimit) R.used=true; lastSig=i; const b=c[i];
    out.sigs.push({i,time:b.time,dir,kind,price:b.close,hi:b.high,lo:b.low,rid:R.id}); ev(dir>0?'buy':'sell',i,(dir>0?'BUY':'SELL')+' · '+kind+' · '+rbsFmt(b.close),R); return true; };
  const inval=(R,i,why)=>{ if(R.state==='invalid') return; R.state='invalid'; R.invalidIdx=i; R.why=why; };
  const mk=(box,i,st,tc,manual)=>{ const R={id:out.ranges.length+1,T:box.T,B:box.B,H:box.T-box.B,tol:P.tolPct/100*(box.T-box.B),side:box.side||'',anchor:box.anchor,startIdx:st,createdIdx:i,
      state:'active',dir:0,breakIdx:-1,invalidIdx:-1,why:'',level:NaN,tT:tc[0],tB:tc[1],lT:-99,lB:-99,rStage:0,rIdx:-1,rHigh:0,rLow:0,sigCount:0,used:false,retestExpired:false,manual:!!manual,endForced:-1,endIdx:i,toEdge:false,pct:P.pct};
    if(P.replaceOld) out.ranges.forEach(q=>inval(q,i,'replaced by a newer range'));
    out.ranges.push(R); ev('range',i,'New range '+rbsFmt(R.B)+' – '+rbsFmt(R.T),R); return R; };

    const brk=P.logic!=='Reclaim', rcl=P.logic!=='Break & Retest';
    if(R.endForced>=0&&i>R.endForced){ inval(R,i,'manual end point'); return; }
    if(P.maxAge>0&&i-R.createdIdx>P.maxAge){ inval(R,i,'maximum age reached'); return; }
    if(R.state==='active'){
      if(b.high>=T-tol){ if(i-R.lT>=3) R.tT++; R.lT=i; } if(b.low<=B+tol){ if(i-R.lB>=3) R.tB++; R.lB=i; }

    if(active||man) continue;

    else if(P.extMode==='Infinite / right edge'){ e=last; edge=true; }
    else if(P.extMode==='Fixed number of candles'){ if(R.state!=='active'){ let f=(R.breakIdx>=0?R.breakIdx:R.invalidIdx)+P.extBars; if(R.state==='invalid') f=Math.min(f,R.invalidIdx); if(f<last){ e=f; edge=false; } } }
    else if(R.state==='invalid'){ e=R.invalidIdx; edge=false; }
    if(R.endForced>=0&&R.state==='invalid'&&R.why==='manual end point'){ e=R.endForced; edge=false; }
    R.endIdx=Math.max(R.startIdx,e); R.toEdge=edge; });

  toast('🔔 '+a.name+' · '+a.sym+' '+a.tf,'#2962ff'); if(a.vib&&navigator.vibrate) navigator.vibrate([200,100,200,100,200]); if(a.sound) beep();

    if(navigator.serviceWorker&&navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(rg=>rg.showNotification(a.name,no)).catch(()=>{ try{ new Notification(a.name,no); }catch(e){} }); else new Notification(a.name,no); } }catch(e){}
  updateAlertBtn(); save();
}
function evalAlerts(){
  alerts.forEach(a=>{
    if(!a.on||a.sym!==sym[0]||a.tf!==tf[0]) return;
    const res=a.conds.map(evalCond), ok=a.mode==='Any condition'?res.some(Boolean):res.every(Boolean);
    if(ok&&a._was===false&&(a.trig!=='Every time'||Date.now()-(a.fired||0)>30000)) fireAlert(a);
    a._was=ok;
  });
}

// ---------- persistent drawings (saved per market, by TIME so they survive timeframe changes and app restarts) ----------
const DW_PREFIX='mpDraw:', DW_SKIP=new Set(['image']);
let dwReady=false, dwSym=null, dwLast=null; const dwMem={};
const dwIdb=()=>new Promise((res,rej)=>{ try{ const r=indexedDB.open('mpDraw',1); r.onupgradeneeded=()=>r.result.createObjectStore('d'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } });
const dwIdbPut=(k,v)=>{ dwIdb().then(db=>{ const tx=db.transaction('d','readwrite'); if(v==null) tx.objectStore('d').delete(k); else tx.objectStore('d').put(v,k); tx.oncomplete=()=>db.close(); tx.onerror=()=>db.close(); }).catch(()=>{}); };
const dwIdbGet=k=>dwIdb().then(db=>new Promise(res=>{ const r=db.transaction('d').objectStore('d').get(k); r.onsuccess=()=>{ db.close(); res(r.result||null); }; r.onerror=()=>{ db.close(); res(null); }; })).catch(()=>null);
function dwCaptureView(){ try{ if(!dwReady||!candles.length) return null; const r=chart.timeScale().getVisibleLogicalRange(); if(!r) return null; return {sym:dwSym,t0:dwI2T(r.from),t1:dwI2T(r.to)}; }catch(e){ return null; } }
let dwView=null;
const dwStep=()=>{ const n=candles.length; let st=n>1?candles[n-1].time-candles[n-2].time:0; if(!(st>0)) st=BASE_SEC[tf[1]]; return st||60; };
function dwI2T(i){ const n=candles.length; if(!n) return null; const st=dwStep();
  if(i<=0) return candles[0].time+i*st; if(i>=n-1) return candles[n-1].time+(i-(n-1))*st;
  const a=Math.floor(i), f=i-a; return candles[a].time+f*(candles[a+1].time-candles[a].time); }
function dwT2I(t){ const n=candles.length; if(!n) return null; const st=dwStep();
  if(t<=candles[0].time) return (t-candles[0].time)/st; if(t>=candles[n-1].time) return (n-1)+(t-candles[n-1].time)/st;
  let lo=0, hi=n-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(candles[m].time<=t) lo=m; else hi=m; }
  return lo+(t-candles[lo].time)/(candles[lo+1].time-candles[lo].time); }
function dwPack(){ const out=[]; drawings.forEach(d=>{ if(!d||!d.pts||DW_SKIP.has(d.type)) return;
  const pts=d.pts.map(q=>{ const t=dwI2T(q.i); return t==null?null:{t:Math.round(t*1000)/1000,p:q.p}; }); if(pts.some(q=>!q)) return;
  const c={}; Object.keys(d).forEach(k=>{ if(k[0]!=='_'&&k!=='pts'&&k!=='img') c[k]=d[k]; }); c.pts=pts; out.push(c); }); return out; }

  try{ if(typeof rp!=='undefined'&&rp) return; }catch(e){}
  try{ const js=JSON.stringify(dwPack()), key=DW_PREFIX+dwSym; if(!force&&js===dwLast) return; dwLast=js;
    if(js==='[]'){ delete dwMem[key]; dwIdbPut(key,null); try{ localStorage.removeItem(key); }catch(e){} }
    else{ dwMem[key]=js; dwIdbPut(key,js); try{ localStorage.setItem(key,js); }catch(e){} } }catch(e){} }
function dwLoadList(raw){ let n=0; try{ const L=JSON.parse(raw); if(Array.isArray(L)) L.forEach(d=>{ if(!d||!Array.isArray(d.pts)) return; const pts=d.pts.map(q=>({i:dwT2I(q.t),p:q.p})); if(pts.some(q=>q.i==null||!isFinite(q.i))) return; d.pts=pts; if(!d.o) d.o={}; if(!d.vis) d.vis=VIS0(); drawings.push(d); n++; }); }catch(e){} return n; }
function dwRestore(){

}

// ---------- data ----------
const toCandle=k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]});
async function fetchBase(pages){
  let end=null, all=[], full=false;
  for(let p=0;p<pages;p++){
    const res=await fetch(`${API}/api/v3/klines?symbol=${sym[0]}&interval=${tf[1]}&limit=1000${end?'&endTime='+end:''}`);
    if(!res.ok) throw new Error(res.status);
    const rows=await res.json(); full=rows.length>=1000; if(!rows.length) break;
    all=rows.map(toCandle).concat(all);
    end=rows[0][0]-1; if(!full) break;
  } moreOld=full; return all;
}
async function load(){
  const my=++token;
  CONN.gen++; clearTimeout(CONN.timer); clearTimeout(CONN.openT); CONN.tries=0; CONN.polling=false; CONN.lastMsg=0; CONN.verifiedAt=0; CONN.hadData=false; CONN.cachedAt=0;
  if(ws){ ws.onopen=ws.onmessage=ws.onclose=ws.onerror=null; try{ ws.close(); }catch(e){} ws=null; }
  connSet('connecting');
  dwSave(true); dwView=dwCaptureView(); dwReady=false; try{ srRecent(sym[0]); }catch(e){}
  drawings=[]; pending=null; disarm(); sel=null; dbarUpdate();
  alerts.forEach(a=>{ a._was=null; a.conds.forEach(c=>{ c._p=null; }); });
  $('bSym').textContent=sym[0]; $('bTf').textContent=tf[0]; save();
  setStatus('loading…');
  let fromCache=false, cachedAt=0;
  for(let tries=1;;tries++){
    try{ if(!navigator.onLine) throw new Error('offline'); base=await fetchBase(4); break; }
    catch(e){ if(my!==token) return;
      if(!navigator.onLine||tries>=3){
        const hit=await cacheLoad(ckey()); if(my!==token) return;
        if(hit&&hit.rows&&hit.rows.length){ base=hit.rows.map(r=>({time:r[0],open:r[1],high:r[2],low:r[3],close:r[4],volume:r[5]})); moreOld=false; fromCache=true; cachedAt=hit.t; break; }
        offlineMode=!navigator.onLine; CONN.needLoad=true; base=[]; candles=[]; try{ candle.setData([]); }catch(x){}
        connSet(navigator.onLine?'disconnected':'offline'); setStatus(navigator.onLine?'could not load data – retrying…':'offline – no saved data for this market');
        if(navigator.onLine){ CONN.loadTries++; clearTimeout(CONN.timer); CONN.timer=setTimeout(()=>{ if(my===token) load(); },Math.min(15000,2000*CONN.loadTries)); } return;
      }
      setStatus('retrying…'); await new Promise(r=>setTimeout(r,1200)); }
  }
  if(my!==token) return;
  CONN.needLoad=false; CONN.loadTries=0; CONN.hadData=true; if(!fromCache) CONN.verifiedAt=Date.now();
  const safe=f=>{ try{ f(); }catch(e){} };
  candles=aggregate(base,tf);
  { const lc=candles.length?candles[candles.length-1].close:1, pd=lc>=1?2:Math.min(10,Math.max(2,Math.ceil(-Math.log10(lc||1))+3));

const STALE_MS=12000, VERIFY_MS=8000, DEAD_MS=45000;

// fetch the newest candles over REST and merge them in (used after a drop, as a liveness check, and as a polling fallback)
async function catchUp(my){
  if(!base.length) return false;
  try{
    const bs=BASE_SEC[tf[1]]||2592000, gap=Date.now()/1000-base[base.length-1].time, lim=Math.max(5,Math.min(1000,Math.ceil(gap/bs)+3));
    const res=await fetch(`${API}/api/v3/klines?symbol=${sym[0]}&interval=${tf[1]}&limit=${lim}`); if(!res.ok) return false;
    const rows=await res.json(); if(!Array.isArray(rows)||!rows.length||my!==token) return false;
    const cs=rows.map(toCandle), t0=cs[0].time, replaced=base[base.length-1].time<t0, oldLen=candles.length;
    base=replaced?cs:base.filter(c=>c.time<t0).concat(cs);
    const nc=aggregate(base,tf), a=nc[nc.length-1], b=candles[candles.length-1];
    const changed=replaced||nc.length!==oldLen||!b||!a||a.time!==b.time||a.close!==b.close||a.high!==b.high||a.low!==b.low||a.volume!==b.volume;

    }

}

function connFail(my){

        const m=new Map(); for(let i=1;i<k.length;i++){ const a=+k[i-1][4], b=+k[i][4]; if(a>0&&b>0) m.set(k[i][0],Math.log(b/a)); } return {s,m}; }catch(e){ return null; } }));

    const pear=(A,B)=>{ const [S,L]=A.m.size<=B.m.size?[A.m,B.m]:[B.m,A.m]; let n=0,sx=0,sy=0,sxx=0,syy=0,sxy=0;

      if(n<20) return null; const cv=sxy-sx*sy/n, vx=sxx-sx*sx/n, vy=syy-sy*sy/n; if(vx<=0||vy<=0) return null; return Math.max(-1,Math.min(1,cv/Math.sqrt(vx*vy))); };

        for(let j=0;j<N;j++) h+=`<div data-i="${i}" data-j="${j}" style="background:${i===j?'rgba(255,255,255,.06)':col(M[i][j])};border-radius:5px;text-align:center;padding:9px 0;color:${i===j?'var(--mut)':'var(--txt)'}">${i===j?'·':f2(M[i][j])}</div>`; }

const b64u={ enc:u8=>{ let s=''; for(let i=0;i<u8.length;i+=8192) s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },

async function shareEncode(obj){ const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream!=='undefined'){ try{ return 'z.'+b64u.enc(await pipe(raw,CompressionStream)); }catch(e){} }
  return 'p.'+b64u.enc(raw); }
async function shareDecode(code){ const k=code.slice(0,2), body=b64u.dec(code.slice(2));
  if(k==='z.'){ if(typeof DecompressionStream==='undefined') throw new Error('This browser cannot open compressed links'); return JSON.parse(new TextDecoder().decode(await pipe(body,DecompressionStream))); }
  if(k==='p.') return JSON.parse(new TextDecoder().decode(body)); throw new Error('bad link'); }

// ---------------- [afx] Auto Fibonacci indicator (latest swing / range) ----------------
const AFX_LV=[[0,'#9aa3b5'],[.236,'#ff5d7a'],[.382,'#ff9800'],[.5,'#2dd4a7'],[.618,'#2dd4a7'],[.786,'#4dabf7'],[1,'#9aa3b5']];

function afxCalc(c,p){
  const n=c.length; if(n<30) return null; let S,E,si,ei;
  if(p.mode==='Range high/low'){
    const from=Math.max(0,n-Math.round(p.range)); let hi=-Infinity,lo=Infinity,hiI=0,loI=0;
    for(let i=from;i<n;i++){ if(c[i].high>=hi){ hi=c[i].high; hiI=i; } if(c[i].low<=lo){ lo=c[i].low; loI=i; } }
    if(!(hi>lo)) return null; if(hiI>loI){ S=lo; si=loI; E=hi; ei=hiI; } else { S=hi; si=hiI; E=lo; ei=loI; }
  } else {
    const ps=Math.max(1,Math.round(p.ps)), at=atrW(c,14), piv=[], from=Math.max(ps,n-2500);
    for(let j=n-1-ps;j>=from;j--){ if(pivAt(c,j,ps,ps,'h')) piv.push({i:j,k:'h',p:c[j].high}); if(pivAt(c,j,ps,ps,'l')) piv.push({i:j,k:'l',p:c[j].low}); }

    if(!Q) return null; E=P0.p; ei=P0.i; S=Q.p; si=Q.i;
    for(let i=P0.i+1;i<n;i++){ if(P0.k==='h'&&c[i].high>E){ E=c[i].high; ei=i; } else if(P0.k==='l'&&c[i].low<E){ E=c[i].low; ei=i; } }   // swing keeps tracking a new extreme that is not yet a confirmed pivot
  }
  if(S===E) return null; return {S,E,si,ei,up:E>S};
}
const afxPx=(r,l)=>r.E+(r.S-r.E)*l;   // 0 at the swing end, 1 at the swing start

/* technicals: oscillators + moving averages on the chart's current candles */
const sma=(a,n)=>a.length<n?null:a.slice(-n).reduce((x,y)=>x+y)/n;

function rsi(a,n){ n=n||14; if(a.length<n+1) return null; let g=0,l=0; for(let i=1;i<=n;i++){ const d=a[i]-a[i-1]; d>=0?g+=d:l-=d; } g/=n; l/=n;

function paintTech(){ const box=gid('si-tc'); if(!box) return; const t=techCalc(); if(!t){ box.innerHTML='<div class="si-e">Not enough candles on this chart yet.</div>'; return; }

      [[1000,'$1K+'],[5000,'$5K+'],[10000,'$10K+'],[50000,'$50K+'],[100000,'$100K+'],[1000000,'$1M+']].forEach(([v,lb])=>chip(a,lb,cfg.min===v,()=>{ cfg.min=v; again(); }));
      const b=chips('SHOW');
      chip(b,'All',cfg.side==='all',()=>{ cfg.side='all'; again(); });
      chip(b,'Longs wiped out',cfg.side==='long',()=>{ cfg.side='long'; again(); });
      chip(b,'Shorts wiped out',cfg.side==='short',()=>{ cfg.side='short'; again(); });
      sumEl=document.createElement('div'); sumEl.className='lq-sum'; groups.appendChild(sumEl);
      stEl=document.createElement('div'); stEl.className='ec-note'; groups.appendChild(stEl);
      listEl=document.createElement('div'); groups.appendChild(listEl);
      const n=document.createElement('div'); n.className='ec-note'; n.textContent='Forced closes on Binance futures. A long liquidation means price fell and a leveraged buyer was closed (red). A short liquidation means price rose and a leveraged seller was closed (green). Liquidations are collected only after you first open this screen.'; groups.appendChild(n);
      render();
    });
  };
  const _prev=$('bMore').onclick;
  $('bMore').onclick=function(){
    if(_prev) _prev.apply(this,arguments);
    const b=document.createElement('button'); b.type='button'; b.innerHTML='<b>\uD83D\uDCA5</b>Liquidations';
    b.onclick=()=>{ close(); setTimeout(window.mpLiq,60); };
    let row=null; [...groups.querySelectorAll('.si-tiles')].forEach(r=>{ const h=r.previousElementSibling; if(h&&h.textContent==='NEWS') row=r; });
    if(row){ row.appendChild(b); return; }
    const h=document.createElement('h4'); h.textContent='NEWS'; row=document.createElement('div'); row.className='si-tiles'; row.appendChild(b);
    groups.insertBefore(row,groups.firstChild); groups.insertBefore(h,row);
  };
})();
}catch(err){ console.error('liquidations failed',err); }
// ================= trend strength quadrant (price vs fast SMA / slow SMA) =================
try{
(function(){
  const css=document.createElement('style');
  css.textContent='.sq-wrap{margin:8px 0 4px}.sq-wrap svg{width:100%;height:auto;display:block;border-radius:12px}'
   +'.sq-row{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}'
   +'.sq-row b{font-weight:700}.sq-row .q{font-size:11px;color:#8b93a7;grid-column:1/-1}'
   +'.sq-up{color:#2ebd85}.sq-dn{color:#ff5d7a}'
   +'html[data-theme=light] .sq-row{border-color:rgba(0,0,0,.08)}';
  document.head.appendChild(css);
  const COINS=['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','TRX','AVAX','LINK','DOT','LTC','BCH','NEAR','UNI','ATOM','XLM','APT','ARB','OP','SUI','INJ','AAVE','PEPE'];
  const KEY='mpStr'; let cfg={tf:'1h',x:20,y:5,n:12};
  try{ Object.assign(cfg,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(cfg)); }catch(e){} };
  const sma=(c,n)=>{ let s=0; for(let i=c.length-n;i<c.length;i++) s+=c[i]; return s/n; };
  const pct=v=>(v>=0?'+':'')+v.toFixed(2)+'%';
  let token=0;
  function quad(x,y){ return x>=0&&y>=0?'Bullish':x<0&&y>=0?'Bearish but weakening':x>=0&&y<0?'Bullish but weakening':'Bearish'; }
  async function load(box,msg){
    const my=++token; msg.textContent='Loading\u2026';
    const need=Math.max(cfg.x,cfg.y)+1, list=COINS.slice(0,cfg.n), out=[];
    await Promise.all(list.map(async s=>{ try{
      const r=await fetch(`${API}/api/v3/klines?symbol=${s}USDT&interval=${cfg.tf}&limit=${need+5}`); const k=await r.json();
      if(!Array.isArray(k)||k.length<need) return;
      const c=k.map(z=>+z[4]), p=c[c.length-1];
      out.push({s,x:(p/sma(c,cfg.x)-1)*100,y:(p/sma(c,cfg.y)-1)*100});
    }catch(e){} }));
    if(my!==token||!document.body.contains(box)) return;
    if(!out.length){ msg.textContent='Could not load prices. Check your connection.'; return; }
    msg.textContent=out.length+' coins \u00B7 Binance spot \u00B7 '+cfg.tf+' candles';
    draw(box,out);
  }
  function draw(box,d){
    const W=360,H=360,P=22,mx=Math.max(1,...d.map(a=>Math.abs(a.x)))*1.15,my=Math.max(1,...d.map(a=>Math.abs(a.y)))*1.15;
    const X=v=>W/2+v/mx*(W/2-P), Y=v=>H/2-v/my*(H/2-P);
    let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">'
     +'<rect x="0" y="0" width="'+W/2+'" height="'+H/2+'" fill="#ff5d7a" fill-opacity=".10"/>'
     +'<rect x="'+W/2+'" y="0" width="'+W/2+'" height="'+H/2+'" fill="#2ebd85" fill-opacity=".30"/>'
     +'<rect x="0" y="'+H/2+'" width="'+W/2+'" height="'+H/2+'" fill="#d6006a" fill-opacity=".45"/>'
     +'<rect x="'+W/2+'" y="'+H/2+'" width="'+W/2+'" height="'+H/2+'" fill="#2ebd85" fill-opacity=".10"/>'
     +'<line x1="'+W/2+'" y1="0" x2="'+W/2+'" y2="'+H+'" stroke="#7a5cff" stroke-width="2"/><line x1="0" y1="'+H/2+'" x2="'+W+'" y2="'+H/2+'" stroke="#2aa0ff" stroke-width="2"/>'
     +'<g font-size="10" fill="#fff" fill-opacity=".7" text-anchor="middle"><text x="'+W*.25+'" y="40">BEARISH BUT</text><text x="'+W*.25+'" y="52">WEAKENING</text>'
     +'<text x="'+W*.75+'" y="46">BULLISH</text><text x="'+W*.25+'" y="'+(H-44)+'">BEARISH</text>'
     +'<text x="'+W*.75+'" y="'+(H-50)+'">BULLISH BUT</text><text x="'+W*.75+'" y="'+(H-38)+'">WEAKENING</text></g>'
     +'<g font-size="9" fill="#cfd6e6"><text x="4" y="'+(H/2-4)+'">'+(-mx).toFixed(1)+'%</text><text x="'+(W-4)+'" y="'+(H/2-4)+'" text-anchor="end">+'+mx.toFixed(1)+'%</text>'
     +'<text x="'+(W/2+4)+'" y="11">+'+my.toFixed(1)+'%</text><text x="'+(W/2+4)+'" y="'+(H-4)+'">'+(-my).toFixed(1)+'%</text></g>';
    d.forEach(a=>{ const cx=X(a.x),cy=Y(a.y);
      s+='<g><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#fff" stroke="'+(a.x>=0&&a.y>=0?'#2ebd85':a.x<0&&a.y<0?'#ff5d7a':'#ffb020')+'" stroke-width="2"/><text x="'+(cx+6)+'" y="'+(cy+3)+'" font-size="9.5" font-weight="700" fill="#fff" stroke="#000" stroke-opacity=".5" stroke-width=".4">'+a.s+'</text></g>'; });
    s+='</svg>';
    d.sort((a,b)=>b.x-a.x);
    box.innerHTML=s+'<div style="margin-top:8px">'+d.map(a=>'<div class="sq-row"><div><b>'+a.s+'</b></div><div class="'+(a.x>=0?'sq-up':'sq-dn')+'">'+pct(a.x)+'</div><div class="'+(a.y>=0?'sq-up':'sq-dn')+'">'+pct(a.y)+'</div><div class="q">'+quad(a.x,a.y)+'</div></div>').join('')+'</div>';
  }
  window.mpStrength=function(){
    openSheet('Trend Strength',()=>{
      const again=()=>{ save(); window.mpStrength(); };
      const a=chips('TIMEFRAME'); [['15m','15m'],['1h','1H'],['4h','4H'],['1d','1D']].forEach(([v,l])=>chip(a,l,cfg.tf===v,()=>{ cfg.tf=v; again(); }));
      const b=chips('X AXIS \u00B7 PRICE VS SMA'); [10,20,50,100,200].forEach(v=>chip(b,String(v),cfg.x===v,()=>{ cfg.x=v; again(); }));
      const c=chips('Y AXIS \u00B7 PRICE VS SMA'); [3,5,10,20].forEach(v=>chip(c,String(v),cfg.y===v,()=>{ cfg.y=v; again(); }));
      const d=chips('COINS'); [8,12,18,24].forEach(v=>chip(d,String(v),cfg.n===v,()=>{ cfg.n=v; again(); }));
      const msg=document.createElement('div'); msg.className='ec-note'; groups.appendChild(msg);
      const box=document.createElement('div'); box.className='sq-wrap'; groups.appendChild(box);
      const n=document.createElement('div'); n.className='ec-note'; n.textContent='Right of the centre line = price above the X-axis SMA. Above the horizontal line = price above the Y-axis SMA. Far upper right is the strongest uptrend, far lower left the strongest downtrend. Columns in the list: X %, Y %.'; groups.appendChild(n);
      load(box,msg);
    });
  };
  const _prev=$('bMore').onclick;
  $('bMore').onclick=function(){
    if(_prev) _prev.apply(this,arguments);
    const b=document.createElement('button'); b.type='button'; b.innerHTML='<b>\uD83E\uDDED</b>Trend Strength';
    b.onclick=()=>{ close(); setTimeout(window.mpStrength,60); };
    let row=null; [...groups.querySelectorAll('.si-tiles')].forEach(r=>{ const h=r.previousElementSibling; if(h&&h.textContent==='NEWS') row=r; });
    if(row){ row.appendChild(b); return; }
    const h=document.createElement('h4'); h.textContent='NEWS'; row=document.createElement('div'); row.className='si-tiles'; row.appendChild(b);
    groups.insertBefore(row,groups.firstChild); groups.insertBefore(h,row);
  };
})();
}catch(err){ console.error('strength failed',err); }

/* mobile helpers: universal close (X) on every bottom sheet + X inside the watchlist header */
(function(){
  try{
    var panel=document.getElementById('panel'), sheet=document.getElementById('sheet'), groups=document.getElementById('groups');
    if(!panel||!sheet) return;
    var x=document.createElement('button'); x.id='pxX'; x.type='button'; x.setAttribute('aria-label','Close'); x.textContent='\u2715';
    x.onclick=function(e){ e.stopPropagation(); sheet.classList.remove('open'); };
    panel.insertBefore(x,panel.firstChild);
    function addWlX(){
      var h=panel.querySelector('.wlh'); if(!h||h.querySelector('.wlh-x')) return;
      var b=document.createElement('button'); b.type='button'; b.className='wlh-i wlh-x'; b.setAttribute('aria-label','Close'); b.textContent='\u2715';
      b.onclick=function(e){ e.stopPropagation(); sheet.classList.remove('open'); }; h.appendChild(b);
    }
    if(groups&&window.MutationObserver) new MutationObserver(addWlX).observe(groups,{childList:true});
  }catch(e){ console.error('mobile helpers',e); }
})();
